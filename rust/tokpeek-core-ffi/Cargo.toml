[package]
name = "tokpeek-core-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokscale-core = { git = "https://github.com/junhoyeo/tokscale", rev = "a3209ff03da1b71262a4dd97bff854c07ca548b3" }
